<!DOCTYPE html>
<!--
  GOTLUCKYLOL - POSTER LANDING PAGE
  ---------------------------------
  This ONE file is the whole page. Open it by double-clicking, edit it in
  any text editor, save, and refresh the browser to see changes.

  3 parts:
    1. <head>  -> page settings (title, font)
    2. <style> -> CSS: how it LOOKS (colors, sizes, layout)
    3. <body>  -> HTML: what it SAYS (the phrase + your social links)

  Search for "EDIT ME" to find the things you need to change.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- EDIT ME: text on the browser tab and in Google results -->
  <title>gotluckylol</title>
  <meta name="description" content="As above, so below. @gotluckylol">

  <!-- Colors the phone's browser bar to match your background -->
  <meta name="theme-color" content="#570008">

  <!-- The little icon on the browser tab (your clover). Keep favicon.png
       in the same folder as this file. -->
  <link rel="icon" href="favicon.png?v=5" type="image/png">

  <!-- The icon (and name) used when someone taps Share > Add to Home Screen
       on an iPhone. Keep apple-touch-icon.png next to this file. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-title" content="gotluckylol">

  <!-- Loads the "Inter" font from Google: ExtraBold (800) for the big
       quote and Medium (500) for the small text at the bottom.
       If it fails to load, the browser uses the backups in --font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1. YOUR COLORS AND FONT
       Change a value here and the whole page updates.
       ============================================================ */
    :root {
      --background: #570008;      /* page background (the exact red you sent) */
      --ink:        #d2cfca;      /* all the lettering and icons (soft off-white) */

      --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;

      /* How much taller the big letters are stretched.
         1 = the font's normal shape (matches your poster).
         Try 1.3 for taller, stretched letters. */
      --stretch: 1;
    }

    /* ============================================================
       2. BASE
       ============================================================ */
    * { box-sizing: border-box; }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;            /* accounts for phone browser bars */
      display: flex;
      flex-direction: column;        /* poster on top, social links below */
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--font);
      background: var(--background);   /* your red, as one flat color */
    }

    /* Film-grain texture laid over the background (drawn by the browser,
       no image file needed). It is blended in a way that keeps your red
       averaging out to exactly #570008.
       opacity = how strong the grain is: raise it for more texture,
       lower it for less. Delete this whole block for none. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;          /* clicks pass through it */
      mix-blend-mode: overlay;
      opacity: 0.5;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Text that only screen readers see. */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ============================================================
       2b. TOP BAR (your clover logo, top center)
       ============================================================ */
    .top {
      position: relative;
      display: flex;
      justify-content: center;       /* centers the logo. Use flex-end for the
                                        right or flex-start for the left. */
      padding: 1rem 1.25rem 0;       /* 1rem = how far it sits from the top */
    }

    .logo {
      display: inline-block;
      line-height: 0;
      border-radius: 0.5rem;
    }

    .logo img {
      display: block;
      height: clamp(3.25rem, 5vw, 4.75rem);   /* logo size. Change to taste */
      width: auto;
    }

    .logo:focus-visible {            /* clear outline for keyboard users */
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    /* ============================================================
       3. THE POSTER (AS ABOVE / SO BELOW)
       Wide screens: each phrase sits on one line, two lines total.
       Phones / tall screens: every word gets its own line, so the
       letters can be huge (see section 5).
       ============================================================ */
    .poster {
      position: relative;
      flex: 1;                       /* fills the space above the links */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vh 4vw 2vh;
      animation: appear 900ms ease-out both;   /* one fade-in on load */
    }

    .quote {
      display: flex;
      flex-direction: column;
      align-items: flex-start;       /* LEFT-aligned. Use center for centered */
    }

    .phrase {
      display: flex;
      flex-direction: row;           /* words side by side */
      justify-content: flex-start;
      column-gap: 0.2em;             /* the space between words */
      font-size: min(19vw, 30vh);    /* biggest size that fits the screen */
      font-weight: 800;              /* ExtraBold, like your poster headline */
      letter-spacing: -0.05em;       /* tight letter spacing, like your poster. More negative = tighter */
      line-height: 0.88;             /* tight space between lines */
      text-transform: none;          /* shows the words exactly as typed */
      white-space: nowrap;
    }

    .phrase + .phrase {
      margin-top: 0;                 /* no extra gap between the two phrases */
    }

    .word {
      display: block;
      transform: scaleY(var(--stretch));   /* makes the letters taller */
      margin-block: calc((var(--stretch) - 1) * 0.45em); /* room for it */
    }

    /* ============================================================
       4. SOCIAL LINKS (bottom of the page)
       ============================================================ */
    .social {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      column-gap: 1.4rem;
      row-gap: 0.25rem;
      padding: 0.75rem 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
    }

    .handle {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 500;              /* Medium, like the line on your poster */
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .links a {
      display: grid;
      place-items: center;
      width: 2.75rem;                /* big enough to tap with a thumb */
      height: 2.75rem;
      color: var(--ink);
      transition: opacity 150ms ease;
    }

    .links a:hover { opacity: 0.7; }   /* slight dim when hovered */

    .links a:focus-visible {         /* clear outline for keyboard users */
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-radius: 4px;
      opacity: 1;
    }

    .links svg {
      width: 1.65rem;                /* icon size. Make bigger or smaller */
      height: 1.65rem;
      fill: currentColor;            /* icons use the --ink color */
    }

    /* The FOMO logo is wider than it is tall, so it gets a bit more width
       to look the same size as the others. */
    .links svg.icon-wide {
      width: 2rem;
    }

    /* The pump.fun pill fills its whole box, so it's a touch smaller. */
    .links svg.icon-pill {
      width: 1.5rem;
      height: 1.5rem;
    }

    /* Hollow TikTok: no fill, just an outline. Change the stroke-width
       number for a thicker or thinner line. */
    .links svg.icon-outline {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linejoin: round;
    }

    /* ============================================================
       5. PHONES / TALL SCREENS
       Switches to one word per line so the lettering fills the screen.
       ============================================================ */
    @media (max-aspect-ratio: 5/4) {
      .top    { padding-top: 2.25rem; }   /* logo sits a bit lower on phones */
      .poster { padding-top: 4vh; }
      .phrase {
        flex-direction: column;      /* words stacked top to bottom */
        align-items: flex-start;     /* words lined up on the left */
        row-gap: 0;
        font-size: min(32vw, 17vh);
      }
    }

    /* ============================================================
       6. EXTRAS
       ============================================================ */
    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Skips the fade-in for people who've asked their device for less
       motion. */
    @media (prefers-reduced-motion: reduce) {
      .poster { animation: none; }
    }
  </style>
</head>

       This still image shows first. The little script at the bottom of
       the page then swaps in the spinning version (logo-spin.webp) as soon

  <!-- Swaps the still logo for the spinning one once it has finished
       loading. To go back to the still logo, delete this whole script. -->
  <script>
    (function () {
      var logo = document.querySelector('.logo img');
      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!logo || reduceMotion) return;

      var spin = new Image();
      spin.onload = function () { logo.src = spin.src; };
      spin.src = 'logo-spin.webp?v=2';   // bump v=2 to v=3 if you replace the file
    })();
  </script>
